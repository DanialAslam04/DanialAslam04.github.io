<!doctype html>
<!--
  Source for assets/og-image.png — the Open Graph / Twitter social card.

  This is a documented source file, not a build step. The site itself ships as
  plain HTML, CSS and JS with nothing to compile; this page exists so the card
  can be regenerated by anyone with any headless browser, without guessing at
  the type sizes or re-deriving the colours.

  To regenerate after editing (Playwright shown; any headless browser works):

    const b   = await chromium.launch();
    const ctx = await b.newContext({
      viewport: { width: 600, height: 315 },
      deviceScaleFactor: 2,            // -> a 1200x630 file with crisp type
    });
    const p = await ctx.newPage();
    await p.goto('file:///absolute/path/to/assets/og-card.html');
    await p.screenshot({ path: 'assets/og-image.png' });
    await b.close();

  Render at 600x315 with deviceScaleFactor 2 rather than at 1200x630 directly:
  both produce 1200x630, but the scaled route renders type at 2x and downsamples,
  which is visibly sharper.

  Keep the output as PNG. The card is flat colour and text, which compresses
  better losslessly than as JPEG (68 KB vs 78 KB), and JPEG rings around glyphs.
  Budget is 100 KB.

  Colours are the site's dark-theme tokens from styles.css. If those change,
  change them here too — nothing links the two automatically.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG card source — Muhammad Danial Aslam</title>
<!-- Served publicly as a side-effect of living in assets/. It is a source
     file, not a page, so keep it out of search results. -->
<meta name="robots" content="noindex, nofollow"/>
<style>
  /* Same tokens as the site's dark theme, so the card and the page match. */
  :root {
    --bg:     #0D1117;
    --text:   #E6EDF3;
    --muted:  #9FB0C0;
    --accent: #58A6FF;
    --accent-2: #3FB9A5;
    --border: #30363D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 600px; height: 315px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 50px;
    position: relative;
    overflow: hidden;
  }

  /* A single accent hairline down the left edge — the only ornament. */
  .rail {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: linear-gradient(to bottom, var(--accent), var(--accent-2));
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 17px;
  }
  .mark {
    width: 19px; height: 19px;
    border-radius: 5px;
    background: var(--accent);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    flex: none;
  }
  .mark i { display: block; height: 2.6px; border-radius: 2px; background: var(--bg); }
  .mark i:nth-child(1) { width: 11px; }
  .mark i:nth-child(2) { width: 8px; }
  .mark i:nth-child(3) { width: 4.5px; }

  .eyebrow span {
    font-size: 12.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  h1 {
    font-size: 42px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -.023em;
    margin-bottom: 11px;
  }

  .role {
    font-size: 21px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 19px;
  }

  .tagline {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: -.005em;
    padding-left: 13px;
    border-left: 2px solid var(--accent);
    line-height: 1.45;
  }

  .stack {
    position: absolute;
    left: 50px;
    bottom: 32px;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: .015em;
  }
  .stack b { color: #C3D0DC; font-weight: 600; }
</style>
</head>
<body>
  <div class="rail"></div>

  <div class="eyebrow">
    <div class="mark"><i></i><i></i><i></i></div>
    <span>danialaslam04.github.io</span>
  </div>

  <h1>Muhammad&nbsp;Danial&nbsp;Aslam</h1>
  <p class="role">Backend &amp; Agentic AI Engineer</p>
  <p class="tagline">Models propose.<br/>Deterministic code executes.</p>

  <p class="stack"><b>Google ADK</b> · <b>MCP</b> · <b>Vertex AI</b> · <b>Spring Boot</b> · <b>FastAPI</b> · <b>GKE</b></p>
</body>
</html>
