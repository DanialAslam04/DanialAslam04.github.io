<!doctype html>
<!--
  Source for assets/og-image.png — the Open Graph / Twitter social card.

  This is a documented source file, not a build step. The site itself ships as
  plain HTML, CSS and JS with nothing to compile; this page exists so the card
  can be regenerated by anyone with any headless browser, without guessing at
  the type sizes or re-deriving the colours.

  To regenerate after editing (Playwright shown; any headless browser works):

    const b   = await chromium.launch();
    const ctx = await b.newContext({
      viewport: { width: 600, height: 315 },
      deviceScaleFactor: 2,            // -> a 1200x630 file with crisp type
    });
    const p = await ctx.newPage();
    await p.goto('file:///absolute/path/to/assets/og-card.html');
    await p.screenshot({ path: 'assets/og-image.png' });
    await b.close();

  Render at 600x315 with deviceScaleFactor 2 rather than at 1200x630 directly:
  both produce 1200x630, but the scaled route renders type at 2x and downsamples,
  which is visibly sharper.

  Keep the output as PNG, and write it at the SAME path. Platforms cache the
  card by URL: an in-place update reaches every link already shared, while a
  rename leaves those links with nothing. That is why this is still a .png
  even though the card now contains a photograph.

  Budget: 128 KB, re-derived 2026-10-04, was 100 KB. The old figure was set
  when the card was flat colour and text; a photograph does not compress in
  long runs and the honest cost of the face at 118px is about 117 KB. Holding
  100 KB would have meant an 88px face, which reads as a token rather than a
  person — the opposite of why the face was added. Re-check this figure after
  any change that alters what KIND of content is on the card, not merely its
  type sizes.

  Two things the encode depends on, both measured rather than assumed:
  write colorType 2 with deflateLevel 9 and deflateStrategy 1. The screenshot
  comes back RGBA and the card is fully opaque, so dropping the alpha channel
  is lossless and saves about 13 KB; strategy 1 beats the default, and
  strategy 2 is catastrophic here (387 KB).

  JPEG was tested rather than dismissed: q92 is 85 KB with the full-size face
  and its ringing measures 16/255 maximum on 0.41% of pixels in the headline
  band, which is invisible. It is a legitimate option and the only reason it
  is not used is the URL-cache argument above.

  Render over http rather than file:// so the @font-face below resolves. The
  photo is a sibling file now, so http is doubly required: over file:// the
  font silently falls back AND the face may not load at all.

  Colours are the site's dark-theme tokens from styles.css. If those change,
  change them here too — nothing links the two automatically.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG card source — Muhammad Danial Aslam</title>
<!-- Served publicly as a side-effect of living in assets/. It is a source
     file, not a page, so keep it out of search results. -->
<meta name="robots" content="noindex, nofollow"/>
<style>
  /* Same tokens as the site's dark theme, so the card and the page match. */
  /* The site's dark tokens, as of the Geist rebuild. The teal second accent
     is gone: the page runs a two-level blue, an interface level and a signal
     level, and a third hue on the card would be the only place it appears. */
  :root {
    --bg:     #070B12;
    --text:   #EEF1F6;
    --muted:  #8891A3;
    --accent: #4DA3FF;   /* interface blue */
    --signal: #96CEFF;   /* signal blue — the brighter of the two */
  }
  @font-face{font-family:'Geist';font-style:normal;font-weight:400 700;
    src:url('geist-latin.woff2') format('woff2');font-display:block}
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 600px; height: 315px; }

  /* The page's 56px grid is deliberately NOT here. Measured, it cost 18 KB
     of a 100 KB budget — a flat ground compresses in long runs and a grid
     breaks every one of them — and at the size a social card is actually
     looked at, a .055 alpha line is invisible. 18 KB for texture nobody
     sees, on a file every crawler fetches. The card reads as the site
     through the navy, the Geist and the two-level blue instead. */
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Geist', -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 50px;
    position: relative;
    overflow: hidden;
  }

  /* A single accent hairline down the left edge — the only ornament. */
  .rail {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: linear-gradient(to bottom, var(--accent), var(--signal));
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 17px;
  }
  .mark {
    width: 19px; height: 19px;
    border-radius: 5px;
    background: var(--accent);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 2px;
    flex: none;
  }
  .mark i { display: block; height: 2.6px; border-radius: 2px; background: var(--bg); }
  .mark i:nth-child(1) { width: 11px; }
  .mark i:nth-child(2) { width: 8px; }
  .mark i:nth-child(3) { width: 4.5px; }

  .eyebrow span {
    font-size: 12.5px;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  h1 {
    font-size: 42px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -.023em;
    margin-bottom: 11px;
  }

  .role {
    font-size: 21px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 19px;
  }

  /* Sans, like the page — the second family went with the rebuild. */
  .tagline {
    font-size: 17px;
    font-weight: 600;
    color: var(--signal);
    letter-spacing: -.012em;
    padding-left: 13px;
    border-left: 2px solid var(--accent);
    line-height: 1.4;
  }

  /* max-width is a guard, not a layout: the face occupies the bottom-right
     corner, so a stack line long enough to run under it would collide. Six
     entries did, by 27px. Five clear it. If this list grows, check the gap
     rather than trusting that it still fits. */
  .stack {
    position: absolute;
    left: 50px;
    bottom: 32px;
    max-width: 360px;
    font-size: 12.5px;
    color: var(--muted);
    letter-spacing: .015em;
  }
  .stack b { color: #C3D0DC; font-weight: 600; }
  h1 { font-weight: 600; }

  /* The face sits bottom-right, below the headline's band, because a
     one-line 42px name and a right-hand photo cannot both fit across 600px:
     the name alone inks about 430px, leaving under 170px of column. Rather
     than shrink the name or wrap it, the circle takes the corner the stack
     line leaves empty. Measured clear of the h1, not assumed.

     118px here is 236 device px at deviceScaleFactor 2, against a 400x400
     source — inside native, same budget rule as the hero. A circle for the
     same reason as the hero too, though the card is always dark so it is
     consistency rather than necessity. */
  .face {
    position: absolute;
    right: 50px;
    bottom: 30px;
    width: 118px;
    height: 118px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(148,163,184,.28);
  }
</style>
</head>
<body>
  <div class="rail"></div>

  <div class="eyebrow">
    <div class="mark"><i></i><i></i><i></i></div>
    <span>danialaslam04.github.io</span>
  </div>

  <h1>Muhammad&nbsp;Danial&nbsp;Aslam</h1>
  <p class="role">Backend &amp; Agentic AI Engineer</p>
  <p class="tagline">Autonomous by default.<br/>Gated where it counts.</p>

  <img class="face" src="danial-aslam.jpg" alt=""/>

  <p class="stack"><b>Google ADK</b> · <b>MCP</b> · <b>Vertex AI</b> · <b>Spring Boot</b> · <b>Google Cloud</b></p>
</body>
</html>
