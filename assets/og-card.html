<!doctype html>
<!--
  Source for assets/og-image.png — the Open Graph / Twitter social card.

  This is a documented source file, not a build step. The site itself ships as
  plain HTML, CSS and JS with nothing to compile; this page exists so the card
  can be regenerated by anyone with any headless browser, without guessing at
  the type sizes or re-deriving the colours.

  To regenerate after editing (Playwright shown; any headless browser works):

    const b   = await chromium.launch();
    const ctx = await b.newContext({
      viewport: { width: 600, height: 315 },
      deviceScaleFactor: 2,            // -> a 1200x630 file with crisp type
    });
    const p = await ctx.newPage();
    await p.goto('http://localhost:PORT/assets/og-card.html');
    await p.screenshot({ path: 'assets/og-image.png' });
    await b.close();

  Render at 600x315 with deviceScaleFactor 2 rather than at 1200x630 directly:
  both produce 1200x630, but the scaled route renders type at 2x and downsamples,
  which is visibly sharper.

  Render over http rather than file://, or the @font-face below silently falls
  back to a system sans and the photo may not load at all. Everything about the
  layout below is tuned to Geist's metrics; a fallback face changes the line
  widths and the two-column split stops fitting.

  Keep the output as PNG, and write it at the SAME path. Platforms cache the
  card by URL: an in-place update reaches every link already shared, while a
  rename leaves those links with nothing. That is why this is still a .png
  even though the card contains a photograph.

  Budget: 128 KB, re-derived 2026-10-04. A photograph does not compress in long
  runs the way flat colour does, and the honest cost of a face large enough to
  read as a person rather than a token is most of that. Re-check the figure
  after any change that alters what KIND of content is on the card, not merely
  its type sizes.

  This card lands at 104.1 KB (106,583 bytes). Desaturating the portrait is
  worth 22.4 KB of that, measured by rendering the identical card with the
  grayscale filter removed: 129,565 bytes in colour against 106,583 here. The
  colour version only fits the budget at all by about 2 KB, so the desaturation
  is buying headroom as well as matching the site.

  The encode: colorType 2, deflateLevel 9, deflateStrategy 0. The screenshot
  comes back RGBA and the card is fully opaque, so dropping the alpha channel
  is lossless — verified per-pixel at encode time rather than assumed.

  Strategy is measured, and the right answer MOVED when the card changed. On
  the previous card (colour face, navy ground) strategy 1 won by 1,009 bytes;
  on this one strategy 0 wins by 836. Strategy 3 costs 27 KB and strategy 2 is
  catastrophic (382.9 KB). The difference between 0 and 1 is under 1% either
  way, so the point is not the saving — it is that a strategy copied forward
  from a previous card is an assumption, not a measurement. Re-run all four.

  Colours are the site's tokens from styles.css — black ground, one lime
  accent. If those change, change them here too: nothing links the two
  automatically, and this file being out of step with the site is exactly the
  bug this revision fixed. The previous card was still the navy/blue build
  months after the site stopped being navy, so every link ever shared previewed
  a design that no longer existed.
-->
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>OG card source — Muhammad Danial Aslam</title>
<!-- Served publicly as a side-effect of living in assets/. It is a source
     file, not a page, so keep it out of search results. -->
<meta name="robots" content="noindex, nofollow"/>
<style>
  /* The site's tokens, verbatim from styles.css. */
  :root {
    --bg:    #0A0A0B;
    --fg:    #F2F2F4;
    --fg-2:  #B3B3BC;
    --fg-3:  #7E7E88;
    --acc:   #CCF24D;
    --line:  rgba(255,255,255,.09);
  }
  @font-face{font-family:'Geist';font-style:normal;font-weight:100 900;
    src:url('geist-latin.woff2') format('woff2');font-display:block}
  @font-face{font-family:'Geist Mono';font-style:normal;font-weight:100 900;
    src:url('geist-mono-latin.woff2') format('woff2');font-display:block}

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 315px; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Geist', -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  /* ------------------------------------------------ the portrait panel
     A full-bleed right column rather than a circle dropped into a corner.
     The site's portrait is a rounded rectangle under a radial mask, never a
     circle, and it sits at the edge of its column — this is the same move at
     card scale. The left edge fades into the ground so the photograph reads
     as part of the card instead of pasted onto it.

     Sized, not styled: 133x163 here is 266x326 device px at deviceScaleFactor
     2, against a 400x400 source — inside native. The first draft of this card
     ran the portrait full-bleed down the right edge, which looked better and
     was wrong: 196x315 is 392x630 device px, a 1.58x upscale of a 400px file.
     The budget rule above is the reason this box is bounded.

     Its top and bottom are not free either: top aligns with the headline's
     first line, bottom with the footer rule, so the photograph measures the
     same block the type does. Change the type sizes and these two numbers
     have to move with them.

     Desaturated to match the site's resting state: on a pointer device the
     portrait there is grayscale until hovered, which is how most people see
     it. It is also the more sober of the two, which is the point of the card. */
  .portrait {
    position: absolute;
    right: 44px; top: 91px;
    width: 133px; height: 163px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 22%;
    display: block;
    filter: grayscale(1) brightness(.95) contrast(1.06);
  }

  /* ------------------------------------------------ the text column
     Width is set against the portrait panel, not guessed: 600 - 196 panel
     - 44 left gutter leaves 360, and the headline is sized to sit inside it.
     Measured, not assumed — see the regeneration notes. */
  .col {
    position: absolute;
    left: 44px; top: 48px;
    width: 353px;
  }

  /* eyebrow: the DA mark plus the domain, in mono like every label on the
     site. The mark is the favicon's artwork, same paths, so the tab icon and
     the share card are visibly one thing. */
  .eyebrow { display: flex; align-items: center; gap: 9px; }
  .eyebrow svg { display: block; flex: none; }
  .eyebrow span {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .085em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  /* The headline is the site's h1, not the name: the platform already prints
     the name above the image from og:title, so repeating it at the largest
     size on the card spends the card's one loud voice on a duplicate. */
  h1 {
    margin-top: 24px;
    font-size: 32px;
    line-height: 1.12;
    font-weight: 600;
    letter-spacing: -.028em;
    color: var(--fg);
  }
  h1 em { font-style: normal; color: var(--acc); }

  .byline { margin-top: 22px; }
  .byline .name {
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: -.011em;
    color: var(--fg);
  }
  .byline .role {
    margin-top: 3px;
    font-size: 13.5px;
    font-weight: 400;
    color: var(--fg-2);
  }

  /* ------------------------------------------------ the footer rule
     Runs from the gutter to the portrait's right edge and sits exactly on the
     portrait's bottom border, in the same colour — so the two read as one
     continuous hairline rather than a stub that stops in open space. That
     alignment is why .portrait's height is what it is; the two numbers are
     the same number and have to move together. */
  .foot {
    position: absolute;
    left: 44px; bottom: 34px;
    width: 512px;
    padding-top: 13px;
    border-top: 1px solid var(--line);
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .035em;
    color: var(--fg-3);
    white-space: nowrap;
  }
  .foot b { color: var(--fg-2); font-weight: 500; }

</style>
</head>
<body>
  <div class="portrait"><img src="danial-aslam.jpg" alt=""/></div>

  <div class="col">
    <div class="eyebrow">
      <!-- the favicon's artwork, same paths, scaled to 19px -->
      <svg viewBox="0 0 64 64" width="19" height="19" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#CCF24D"/>
        <g fill="#0A0A0B" fill-rule="evenodd">
          <path d="M8.5 15 L12.5 15 A17 17 0 0 1 12.5 49 L8.5 49 Z
                   M15.5 22 A7 10 0 0 1 15.5 42 L15.5 22 Z"/>
          <path d="M33.5 49 L41.4 15 L47.4 15 L55.5 49 L47.9 49 L46.2 40.5 L43.0 40.5 L41.3 49 Z
                   M44.5 25.5 L46.4 35.5 L42.8 35.5 Z"/>
        </g>
      </svg>
      <span>danialaslam04.github.io</span>
    </div>

    <h1>Autonomous by default.<br/><em>Gated where it counts.</em></h1>

    <div class="byline">
      <div class="name">Muhammad Danial Aslam</div>
      <div class="role">Backend &amp; Agentic AI Engineer</div>
    </div>
  </div>

  <div class="foot">
    <b>Google ADK</b> · <b>MCP</b> · <b>Vertex AI</b> · <b>Spring Boot</b>
  </div>
</body>
</html>
