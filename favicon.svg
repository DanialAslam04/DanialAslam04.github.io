<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Muhammad Danial Aslam">
  <!-- Dark tile, lime letters — the site's own orientation. The page is a black
       ground with lime ink, not lime with black ink, and the first version of
       this icon had that backwards: a lime tile is ~70% ink coverage and reads
       as a bright blob in a tab strip. This is 28.9%, measured.

       On dark browser chrome the #0A0A0B tile all but disappears and the mark
       reads as bare lime letters. That is fine, and intended: the letters are
       the mark. A hairline edge to hold the tile shape was tried and turned
       into a muddy ring at 16px that ate into the letters. A tile-less version
       was tried too and fails on LIGHT chrome, where lime on near-white has
       almost no contrast.

       The letterforms are paths, not <text>: an SVG favicon has no guaranteed
       font, so text renders in whatever the browser happens to have.

       Two things that are measured, not eyeballed:
       - The A's diagonals are cut wider than the D's stem. Measured
         perpendicular, a slanted stroke of equal horizontal width reads
         lighter than an upright one. Light-on-dark needs the same
         compensation again, so these strokes are heavier than the first
         (dark-on-light) draft of the same letters.
       - The 1.12 scale is the largest that still clears the tile's 14px corner
         radius; verified by rendering on magenta at 256px and counting lime
         pixels falling outside the rounded rect (zero). The 32.63 y-origin
         centres the letters: at 1.12 about a true centre they sat 5px of 256
         high, because the A's apex is pointed and the D's bowl is not. -->
  <rect width="64" height="64" rx="14" fill="#0A0A0B"/>
  <g fill="#CCF24D" fill-rule="evenodd"
     transform="translate(32,32.63) scale(1.12) translate(-32,-32)">
    <!-- D -->
    <path d="M8 14 L12 14 A17.5 17.5 0 0 1 12 49 L8 49 Z
             M15.8 21.5 A5.9 10 0 0 1 15.8 41.5 L15.8 21.5 Z"/>
    <!-- A -->
    <path d="M34.5 49 L41.9 14 L48.6 14 L56 49 L48.3 49 L46.6 40 L43.9 40 L42.2 49 Z
             M45.25 24 L47.2 35 L43.3 35 Z"/>
  </g>
</svg>
